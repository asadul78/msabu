<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify — Certificate Record</title>
<!--
  This file doubles as the GitHub Pages 404 page. GitHub Pages has no
  server-side routing, so a visit to /validation/SOME-ID doesn't match
  a real file and Pages serves this 404.html instead — which is exactly
  how we turn /validation/SOME-ID into a working "pretty URL".
  Because the browser treats the last path segment as sitting one
  folder below the site root, every asset below is loaded with "../".
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="shell">
  <div class="topbar">
    <a class="wordmark" href="../index.html"><span class="mark">✓</span>Verify</a>
    <a class="nav-link" href="../index.html">Look up another</a>
  </div>

  <div class="result-wrap">
    <div id="result-root" style="width:100%; max-width:560px;">
      <p class="state-msg">Loading…</p>
    </div>
  </div>

  <footer class="site-footer">
    Certificate verification portal.
  </footer>
</div>

<script type="module" src="../js/validate.js"></script>
</body>
</html>
